name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Core security and formatting
        run: ./mvnw -B -ntp clean verify
      - name: PostgreSQL user lookup
        run: ./mvnw -B -ntp -f examples/relational-database/pom.xml clean verify
