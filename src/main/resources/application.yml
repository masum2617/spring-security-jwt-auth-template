spring:
  profiles:
    active: demo
  application:
    name: security-foundation
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
app:
  jwt:
    issuer: ${JWT_ISSUER:security-foundation}
    audience: ${JWT_AUDIENCE:security-foundation-api}
    lifetime: ${JWT_LIFETIME:15m}
    private-key: ${JWT_PRIVATE_KEY:file:.keys/private.pem}
    public-key: ${JWT_PUBLIC_KEY:file:.keys/public.pem}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
